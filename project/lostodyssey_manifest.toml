# Rendimiento (7-oct-2026): registros del PowerPC como variables locales de C++ (como XenonRecomp /
# Unleashed Recompiled); el compilador los mete en registros reales en vez de ir a ctx en memoria.
# El hilo de render del juego (UE3) es el cuello tras el envio asincrono del plugin.
# skip_lr NO: encounter_hooks.cpp y los volcados de pila leen ctx.lr.
# Volver atras: borrar estas lineas (copia en out/copias-exe/).
# non_volatile_as_local NO: el codec de las cinematicas (funciones 0x830F0000-0x8313FFFF, VMX128
# escrito a mano) deja constantes en v17-v31 y llama a subrutinas que las leen; con locales llegan a 0
# y los videos salen con cuadritos verdes/morados (7-oct-2026). share_registers no lo arregla: el
# codegen solo traspasa r14-r31 a esas funciones, no f/v. Sin esta opcion, D3D12 4K va a 67-70 fps.
non_volatile_as_local = false
# non_argument_as_local NO: los funclets de SEH (p. ej. sub_82B7B0C8) reciben el marco del dueno en r12
# (addi r31,r12,-144); con r12 local llega a 0 y la CRT llama a la direccion 0 al arrancar.
non_argument_as_local = false
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
includes = [
  # XDK/CRT functions named after their Blue Dragon counterparts (tools/).
